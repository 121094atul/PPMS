<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No internet — PPMS</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #0c2340 40%, #0f3460 70%, #1a1a2e 100%);
            color: #e2e8f0;
        }
        .card {
            width: 100%;
            max-width: 380px;
            text-align: center;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 2rem 1.5rem;
        }
        .icon { width: 84px; height: 84px; margin-bottom: 1rem; }
        h1 { font-size: 1.25rem; margin: 0 0 .5rem; color: #fff; }
        p { font-size: .9rem; line-height: 1.6; color: #94a3b8; margin: 0 0 .5rem; }
        .hint { font-size: .8rem; color: #64748b; margin-top: 1.25rem; }
        button {
            margin-top: 1.25rem;
            width: 100%;
            padding: .7rem 1rem;
            font-size: .95rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #f97316, #dc2626);
            border: 0;
            border-radius: 10px;
            cursor: pointer;
        }
        button:active { opacity: .85; }
    </style>
</head>
<body>
    <div class="card">
        <img class="icon" src="/images/icon-192.png" alt="PPMS" />
        <h1>No internet connection</h1>
        <p>PPMS needs a connection because your rates, stock and balances have to be
           up to date. Showing you an old copy could lead to a wrong entry.</p>
        <p class="hint">Check your mobile data or Wi-Fi, then try again.</p>
        <button onclick="location.reload()">Try again</button>
    </div>

    <script>
        // Net wapas aate hi apne aap load kar do — user ko button dabana na pade.
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
